name: HisabHero Quality & Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Test Suite & Security Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finsight_jsonversion

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: finsight_jsonversion/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Backend Integration & Security Tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_token_2026_valid
          PORT: 5000
        run: npm test

  mobile-verification:
    name: Mobile Client Type Integrity (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Dependencies
        run: npm install

      - name: Validate TypeScript Compilation
        run: npm run typecheck

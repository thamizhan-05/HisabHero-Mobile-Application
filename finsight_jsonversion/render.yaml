services:
  - type: web
    name: hisabhero-backend
    runtime: node
    rootDir: finsight_jsonversion
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

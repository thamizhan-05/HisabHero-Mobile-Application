<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HisabHero — Authentication & Account Sovereignty</title>
  
  <!-- Fonts: Poppins & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #080b11;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);
      padding: 20px;
      overflow-x: hidden;
    }

    .brand-header {
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-header img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
    }
    .brand-header span {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .auth-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: 520px;
      border: 2px solid #10b981;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.1);
      border-radius: 20px;
      overflow: hidden;
      background: #080b11;
    }

    .auth-wrapper .credentials-panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
    }

    .credentials-panel.signin {
      left: 0;
      padding: 0 45px;
    }

    .credentials-panel.signin .slide-element {
      transform: translateX(0%);
      transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
    }

    .credentials-panel.signin .slide-element:nth-child(1) { transition-delay: 1.4s; }
    .credentials-panel.signin .slide-element:nth-child(2) { transition-delay: 1.5s; }
    .credentials-panel.signin .slide-element:nth-child(3) { transition-delay: 1.6s; }
    .credentials-panel.signin .slide-element:nth-child(4) { transition-delay: 1.7s; }
    .credentials-panel.signin .slide-element:nth-child(5) { transition-delay: 1.8s; }

    .auth-wrapper.toggled .credentials-panel.signin .slide-element {
      transform: translateX(-120%);
      opacity: 0;
      filter: blur(8px);
    }

    .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(1) { transition-delay: 0s; }
    .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(2) { transition-delay: 0.05s; }
    .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(3) { transition-delay: 0.1s; }
    .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(4) { transition-delay: 0.15s; }
    .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(5) { transition-delay: 0.2s; }

    .credentials-panel.signup {
      right: 0;
      padding: 0 45px;
    }

    .credentials-panel.signup .slide-element {
      transform: translateX(120%);
      transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      filter: blur(8px);
    }

    .credentials-panel.signup .slide-element:nth-child(1) { transition-delay: 0s; }
    .credentials-panel.signup .slide-element:nth-child(2) { transition-delay: 0.05s; }
    .credentials-panel.signup .slide-element:nth-child(3) { transition-delay: 0.1s; }
    .credentials-panel.signup .slide-element:nth-child(4) { transition-delay: 0.15s; }
    .credentials-panel.signup .slide-element:nth-child(5) { transition-delay: 0.2s; }
    .credentials-panel.signup .slide-element:nth-child(6) { transition-delay: 0.25s; }

    .auth-wrapper.toggled .credentials-panel.signup .slide-element {
      transform: translateX(0%);
      opacity: 1;
      filter: blur(0px);
    }

    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(1) { transition-delay: 1.3s; }
    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(2) { transition-delay: 1.4s; }
    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(3) { transition-delay: 1.5s; }
    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(4) { transition-delay: 1.6s; }
    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(5) { transition-delay: 1.7s; }
    .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(6) { transition-delay: 1.8s; }

    .credentials-panel h2 {
      font-size: 30px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .credentials-panel .field-wrapper {
      position: relative;
      width: 100%;
      height: 48px;
      margin-top: 20px;
    }

    .field-wrapper input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      border-bottom: 2px solid rgba(255, 255, 255, 0.4);
      padding-right: 28px;
      transition: 0.4s;
    }

    .field-wrapper input:focus,
    .field-wrapper input:valid {
      border-bottom: 2px solid #10b981;
    }

    .field-wrapper label {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      font-size: 15px;
      color: #94a3b8;
      pointer-events: none;
      transition: 0.4s;
    }

    .field-wrapper input:focus ~ label,
    .field-wrapper input:valid ~ label {
      top: -4px;
      font-size: 12px;
      color: #10b981;
      font-weight: 700;
    }

    .field-wrapper i {
      position: absolute;
      top: 50%;
      right: 4px;
      font-size: 16px;
      transform: translateY(-50%);
      color: #94a3b8;
      transition: 0.3s;
    }

    .field-wrapper input:focus ~ i,
    .field-wrapper input:valid ~ i {
      color: #10b981;
    }

    .submit-button {
      position: relative;
      width: 100%;
      height: 44px;
      background: transparent;
      border-radius: 40px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      border: 2px solid #10b981;
      overflow: hidden;
      z-index: 1;
      transition: all 0.3s;
    }

    .submit-button::before {
      content: "";
      position: absolute;
      height: 300%;
      width: 100%;
      background: linear-gradient(#080b11, #10b981, #080b11, #10b981);
      top: -100%;
      left: 0;
      z-index: -1;
      transition: 0.5s;
    }

    .submit-button:hover:before {
      top: 0;
    }

    .switch-link {
      font-size: 13px;
      text-align: center;
      margin: 16px 0 6px;
      color: #cbd5e1;
    }

    .switch-link a {
      text-decoration: none;
      color: #10b981;
      font-weight: 700;
      transition: 0.2s;
    }

    .switch-link a:hover {
      text-decoration: underline;
      color: #34d399;
    }

    .welcome-section {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      display: flex;
      justify-content: center;
      flex-direction: column;
      z-index: 15;
    }

    .welcome-section.signin {
      right: 0;
      text-align: right;
      padding: 0 45px 60px 140px;
    }

    .welcome-section.signin .slide-element {
      transform: translateX(0);
      transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      filter: blur(0px);
    }

    .welcome-section.signin .slide-element:nth-child(1) { transition-delay: 1.4s; }
    .welcome-section.signin .slide-element:nth-child(2) { transition-delay: 1.5s; }

    .auth-wrapper.toggled .welcome-section.signin .slide-element {
      transform: translateX(120%);
      opacity: 0;
      filter: blur(8px);
    }

    .auth-wrapper.toggled .welcome-section.signin .slide-element:nth-child(1) { transition-delay: 0s; }
    .auth-wrapper.toggled .welcome-section.signin .slide-element:nth-child(2) { transition-delay: 0.05s; }

    .welcome-section.signup {
      left: 0;
      text-align: left;
      padding: 0 140px 60px 45px;
      pointer-events: none;
    }

    .welcome-section.signup .slide-element {
      transform: translateX(-120%);
      transition: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      filter: blur(8px);
    }

    .welcome-section.signup .slide-element:nth-child(1) { transition-delay: 0s; }
    .welcome-section.signup .slide-element:nth-child(2) { transition-delay: 0.05s; }

    .auth-wrapper.toggled .welcome-section.signup .slide-element {
      transform: translateX(0%);
      opacity: 1;
      filter: blur(0);
    }

    .auth-wrapper.toggled .welcome-section.signup .slide-element:nth-child(1) { transition-delay: 1.3s; }
    .auth-wrapper.toggled .welcome-section.signup .slide-element:nth-child(2) { transition-delay: 1.4s; }

    .welcome-section h2 {
      text-transform: uppercase;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 900;
      color: #ffffff;
    }

    .auth-wrapper .background-shape {
      position: absolute;
      right: 0;
      top: -5px;
      height: 620px;
      width: 880px;
      background: linear-gradient(45deg, #080b11, #10b981);
      transform: rotate(10deg) skewY(40deg);
      transform-origin: bottom right;
      transition: 1.4s ease;
      transition-delay: 1.2s;
      z-index: 5;
    }

    .auth-wrapper.toggled .background-shape {
      transform: rotate(0deg) skewY(0deg);
      transition-delay: 0.4s;
    }

    .auth-wrapper .secondary-shape {
      position: absolute;
      left: 250px;
      top: 100%;
      height: 720px;
      width: 880px;
      background: #080b11;
      border-top: 3px solid #10b981;
      transform: rotate(0deg) skewY(0deg);
      transform-origin: bottom left;
      transition: 1.4s ease;
      transition-delay: 0.4s;
      z-index: 6;
    }

    .auth-wrapper.toggled .secondary-shape {
      transform: rotate(-11deg) skewY(-41deg);
      transition-delay: 1s;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
    .footer a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .auth-wrapper {
        height: auto;
        min-height: 480px;
        flex-direction: column;
        border-radius: 16px;
      }
      .auth-wrapper .credentials-panel,
      .welcome-section {
        width: 100%;
        position: relative;
      }
      .credentials-panel.signin,
      .credentials-panel.signup {
        padding: 35px 25px;
        left: 0;
        right: 0;
      }
      .credentials-panel.signup { display: none; }
      .auth-wrapper.toggled .credentials-panel.signin { display: none; }
      .auth-wrapper.toggled .credentials-panel.signup { display: flex; }
      .welcome-section { display: none; }
      .auth-wrapper .background-shape,
      .auth-wrapper .secondary-shape { display: none; }
    }
  </style>
</head>
<body>

  <a href="/" class="brand-header">
    <img src="/logo.png" alt="HisabHero" />
    <span>Hisab<span style="color: #10b981;">Hero</span></span>
  </a>

  <div class="auth-wrapper" id="authWrapper">
    <div class="background-shape"></div>
    <div class="secondary-shape"></div>

    <!-- ─── SIGN IN PANEL ─── -->
    <div class="credentials-panel signin">
      <h2 class="slide-element">Login</h2>
      <form id="standaloneLoginForm" onsubmit="handleAuthLogin(event)">
        <div class="field-wrapper slide-element">
          <input type="email" id="loginEmailField" required />
          <label for="loginEmailField">Email Address</label>
          <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="field-wrapper slide-element">
          <input type="password" id="loginPasswordField" required />
          <label for="loginPasswordField">Password</label>
          <i class="fa-solid fa-lock"></i>
        </div>

        <div class="field-wrapper slide-element" style="margin-top: 25px;">
          <button class="submit-button" id="loginBtn" type="submit">Login</button>
        </div>

        <div id="loginStatusMsg" style="color: #f43f5e; font-size: 0.8rem; font-weight: 700; margin-top: 8px; text-align: center;"></div>

        <div class="switch-link slide-element">
          <p>Don't have an account? <br /> <a href="javascript:void(0)" id="registerTrigger" class="register-trigger">Sign Up</a></p>
        </div>
      </form>
    </div>

    <!-- ─── WELCOME BACK BANNER ─── -->
    <div class="welcome-section signin">
      <h2 class="slide-element">WELCOME<br />BACK!</h2>
      <p class="slide-element" style="font-size: 0.85rem; color: #cbd5e1; margin-top: 8px;">Access your financial intelligence & ledger.</p>
    </div>

    <!-- ─── SIGN UP PANEL ─── -->
    <div class="credentials-panel signup">
      <h2 class="slide-element">Register</h2>
      <form id="standaloneSignupForm" onsubmit="handleAuthSignup(event)">
        <div class="field-wrapper slide-element">
          <input type="text" id="signupNameField" required />
          <label for="signupNameField">Full Name</label>
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="field-wrapper slide-element">
          <input type="email" id="signupEmailField" required />
          <label for="signupEmailField">Email Address</label>
          <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="field-wrapper slide-element">
          <input type="password" id="signupPasswordField" required minlength="6" />
          <label for="signupPasswordField">Password</label>
          <i class="fa-solid fa-lock"></i>
        </div>

        <div class="field-wrapper slide-element" style="margin-top: 25px;">
          <button class="submit-button" id="signupBtn" type="submit">Register</button>
        </div>

        <div id="signupStatusMsg" style="color: #f43f5e; font-size: 0.8rem; font-weight: 700; margin-top: 8px; text-align: center;"></div>

        <div class="switch-link slide-element">
          <p>Already have an account? <br /> <a href="javascript:void(0)" id="loginTrigger" class="login-trigger">Sign In</a></p>
        </div>
      </form>
    </div>

    <!-- ─── WELCOME BANNER ─── -->
    <div class="welcome-section signup">
      <h2 class="slide-element">WELCOME!</h2>
      <p class="slide-element" style="font-size: 0.85rem; color: #cbd5e1; margin-top: 8px;">Start your journey to financial sovereignty.</p>
    </div>
  </div>

  <div class="footer">
    <p>© 2026 HisabHero Technologies • <a href="/">Return to Home</a></p>
  </div>

  <script>
    const authWrapper = document.getElementById('authWrapper');
    const loginTrigger = document.getElementById('loginTrigger');
    const registerTrigger = document.getElementById('registerTrigger');

    function clearAllErrors() {
      const loginMsg = document.getElementById('loginStatusMsg');
      const signupMsg = document.getElementById('signupStatusMsg');
      if (loginMsg) loginMsg.textContent = '';
      if (signupMsg) signupMsg.textContent = '';
    }

    registerTrigger.addEventListener('click', (e) => {
      e.preventDefault();
      clearAllErrors();
      authWrapper.classList.add('toggled');
    });

    loginTrigger.addEventListener('click', (e) => {
      e.preventDefault();
      clearAllErrors();
      authWrapper.classList.remove('toggled');
    });

    // Clear error as soon as user starts typing in any field
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => {
        const loginMsg = document.getElementById('loginStatusMsg');
        const signupMsg = document.getElementById('signupStatusMsg');
        if (loginMsg) loginMsg.textContent = '';
        if (signupMsg) signupMsg.textContent = '';
      });
    });

    async function handleAuthLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmailField').value.trim().toLowerCase();
      const password = document.getElementById('loginPasswordField').value;
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('loginStatusMsg');
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('hh_token', data.token);
          localStorage.setItem('token', data.token);
          localStorage.setItem('hh_user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          msg.textContent = data.error || 'Invalid email or password.';
        }
      } catch (err) {
        msg.textContent = 'Network error connecting to authentication server.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    async function handleAuthSignup(e) {
      e.preventDefault();
      const fullName = document.getElementById('signupNameField').value.trim();
      const email = document.getElementById('signupEmailField').value.trim().toLowerCase();
      const password = document.getElementById('signupPasswordField').value;
      const btn = document.getElementById('signupBtn');
      const msg = document.getElementById('signupStatusMsg');
      msg.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, workspaceChoice: 'personal' })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = `/?verifyEmail=${encodeURIComponent(email)}`;
        } else {
          msg.textContent = data.error || 'Registration failed.';
        }
      } catch (err) {
        msg.textContent = 'Network error connecting to authentication server.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    }
  </script>
</body>
</html>

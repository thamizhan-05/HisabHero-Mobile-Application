# 📘 HISABHERO — Complete System & Architecture Specification Report
> **Document Status:** Production-Grade Technical Specification

## 📌 1. Executive Summary & Product Vision

### 1.1 Business Problem & Market Context
Micro, Small, and Medium Enterprises (MSMEs), sole proprietors, freelancers, and growing multi-branch businesses in emerging markets (particularly across India and South Asia) face severe operational friction in day-to-day financial bookkeeping, tax compliance, cash flow forecasting, and fraud prevention. Traditional ERPs (e.g., SAP, Oracle NetSuite) are prohibitively complex and expensive, while legacy single-entry apps (e.g., basic ledger tools) lack enterprise-grade multi-tenancy, cryptographic audit trails, multimodal receipt extraction, and automated GST compliance.

**HisabHero** (*"Hisab"* = Account/Calculation; *"Hero"* = Champion) bridges this divide by delivering a dual-mode platform unifying personal wealth tracking and full-scale business ERP management into a single cross-platform ecosystem.

### 1.2 Core Target Audience
1. **Individuals & Freelancers:** Professionals tracking personal cash flow, categorizing expenses, monitoring savings rates, and planning financial goals.
2. **Retailers & Traders (MSMEs):** Shop owners needing instant vernacular invoice scanning, UPI payment link generation, and Khata (credit/debit) debtor tracking.
3. **Small-to-Medium Enterprises (SMEs):** Companies requiring multi-user role delegation (Owners, Admins, Accountants, Employees, Viewers), multi-branch inventory tracking, payroll disbursement, and purchase order matching.
4. **Chartered Accountants & Auditors:** Financial controllers requiring automated 3-way reconciliation (Invoice $\leftrightarrow$ PO $\leftrightarrow$ Bank), GSTR-1 / GSTR-3B payload generation, and tamper-evident Merkle ledger verification.

### 1.3 Key Pain Points Solved
- **Vernacular Language Barriers:** Full support for Indian regional numerals (Devanagari, Tamil, Telugu, Kannada, Malayalam, Gujarati, Bengali) and speech-to-text bookkeeping in 8+ Indic languages.
- **Manual Data Entry Bottlenecks:** Multimodal AI OCR converts bank statements (CSV/XLSX/PDF) and paper receipts into structured ledger entries within milliseconds.
- **Insolvency & Cash Flow Blindspots:** A 1,000-run Monte Carlo stochastic simulation predicts liquidity runway and insolvency risks 30, 60, and 90 days into the future.
- **Fraud & Tampering Risks:** Cryptographic SHA-256 Merkle audit chains, Ed25519 asymmetric client-side transaction signing, and edge fraud anomaly detection.

### 1.4 The 4 Pillar Capabilities
| Pillar | Focus Area | Technical Realization |
| :--- | :--- | :--- |
| **Pillar I: Dual-Mode Multi-Tenancy** | Isolation & Access Governance | Strict workspace-scoped tenancy with cryptographic 12-char Join Codes (`XXXX-XXXX-XXXX`) and granular 10-point RBAC. |
| **Pillar II: Multimodal Document Intelligence** | High-Velocity Ingestion & OCR | Streaming CSV/XLSX parsers, Google Gemini 2.5 Flash multimodal vision extraction, and automated 3-way document matching. |
| **Pillar III: Predictive Intelligence & AI CFO** | Cash Flow Simulation & Advice | Box-Muller stochastic Monte Carlo insolvency engines, edge fraud anomaly filters, and contextual RAG financial chat. |
| **Pillar IV: Cryptographic Audit & Compliance** | Immutability & Statutory Tax | SHA-256 Merkle block hash chaining, Ed25519 biometric payload signing, GSTR-1/3B engine, and e-Invoice IRN generator. |

## 💻 2. End-to-End Technology Stack

The platform is designed around a decoupled, micro-modular architecture prioritizing type safety, offline-first resilience, and zero-latency vernacular text processing.

| Architectural Layer | Technology / Package | Exact Version | Purpose & Architectural Rationale |
| :--- | :--- | :--- | :--- |
| **Backend Runtime** | Node.js (ESM Engine) | `>=20.0.0` | High-throughput asynchronous event loop utilizing native ES Modules (`import`/`export`). |
| **HTTP Server Framework** | Express.js | `^5.2.1` | Modernized routing layer handling multipart document streams and RESTful API endpoints. |
| **Primary Database & ODM** | MongoDB / Mongoose | `^9.3.2` | Schema-enforced document store supporting multi-tenant indexes, TTL auto-expiry, and Map types. |
| **Generative AI & OCR** | Google GenAI SDK | `^1.46.0` | Gemini 2.5 Flash multimodal vision engine for receipt OCR, statement analysis, and CFO chatbot. |
| **Security & Authentication** | JSON Web Tokens (`jsonwebtoken`) | `^9.0.3` | Cryptographically signed, stateless session tokens (30-day lifespan) with bearer verification. |
| **Password Cryptography** | BcryptJS (`bcryptjs`) | `^3.0.3` | Salted adaptive hashing algorithm (`10` rounds) mitigating brute-force dictionary attacks. |
| **Client-Side Signatures** | TweetNaCl (`tweetnacl`) | `^1.0.3` | Lightweight Ed25519 public-key cryptography for non-repudiable biometric transaction signing. |
| **File Processing & Streams** | Multer (`multer`) | `^2.1.1` | In-memory 25MB buffer staging for instantaneous document scanning without disk leakages. |
| **Tabular Stream Parser** | CSV-Parser (`csv-parser`) | `^3.2.0` | Chunked streaming CSV ingestion processing $>5,000$ banking records per second. |
| **Spreadsheet Engine** | SheetJS (`xlsx`) | `^0.18.5` | Full-spec binary parser for multi-sheet Excel (.xlsx, .xls) bank statement extraction. |
| **Transactional Email** | Nodemailer / Resend SDK | `^8.0.4` / `^6.19.0` | SMTP / REST dual-failover pipeline delivering 6-digit OTP codes and invoice PDF receipts. |
| **Mobile Core Framework** | React Native / Expo SDK | `0.81.5` / `54.0.36` | Universal native mobile build targeting Android (Hermes runtime), iOS, and Web. |
| **Frontend UI Library** | React / React DOM | `19.1.0` | Modern concurrent rendering engine utilizing functional hooks and unified state contexts. |
| **Hardware Biometrics** | Expo Local Authentication | `~17.0.8` | Secure hardware enclave integration for FaceID / Fingerprint transaction authorization. |
| **Hardware Keychain** | Expo SecureStore | `~15.0.8` | OS-level encrypted storage (Android Keystore / iOS Keychain) storing Ed25519 private keys. |
| **Offline Persistence** | AsyncStorage | `2.2.0` | Local client caching of workspaces, session credentials, and CRDT mutation queues. |
| **Iconography** | Lucide React Native | `^1.25.0` | Clean, crisp, scalable vector SVG iconography throughout mobile and desktop views. |

## 🔐 5. Authentication, Session & Security Flow

HisabHero enforces a multi-layered cryptographic authentication flow featuring salted passwords, 6-digit short-lived email OTP verification, Ed25519 client-side transaction signing, and automatic multi-device session governance.

```mermaid
sequenceDiagram
  autonumber
  actor User as 👤 User / Device
  participant Client as 📱 Mobile / Web Client
  participant Server as 🛡️ Express Auth Engine
  participant EmailService as ✉️ Email Dispatcher
  participant DB as 🍃 MongoDB (Users & OTPs)
  participant SecureStore as 🔐 Hardware Keystore

  %% REGISTRATION FLOW
  Note over User, DB: 1. User Registration & OTP Dispatch Phase
  User->>Client: Enters Name, Email, Password, Workspace Choice
  Client->>Client: Validate Password (min 6 chars)
  Client->>Server: POST /api/auth/signup (Payload + Business Details)
  Server->>Server: Bcrypt Hash Password (10 Salt Rounds)
  Server->>Server: Generate 6-Digit Cryptographic Random OTP
  Server->>DB: Save OTP Record (SHA-256 Hash, 10-Min Expiry TTL, Pending Data)
  Server->>EmailService: Dispatch HTML Verification Email
  EmailService-->>User: 📧 Verification Code Sent to Inbox
  Server-->>Client: 201 Created (needsVerification: true)

  %% OTP VERIFICATION & PROVISIONING
  Note over User, DB: 2. OTP Verification & Workspace Provisioning
  User->>Client: Enters 6-Digit Code
  Client->>Server: POST /api/auth/verify-code (email, code)
  Server->>DB: Query OTP Record & Verify SHA-256 Hash Link
  alt Valid Code & Not Expired
    Server->>DB: Create User Entity (isVerified = true)
    Server->>DB: Create Default Personal Workspace
    opt Business Choice Selected
      Server->>Server: Generate Cryptographic Join Code (XXXX-XXXX-XXXX)
      Server->>DB: Create Business Workspace & Assign Owner Role
    end
    Server->>Server: Sign JWT Token (Expires in 30 Days)
    Server->>DB: Clean up Pending OTP Records
    Server-->>Client: 200 OK (token, userProfile, activeWorkspaces)
    Client->>SecureStore: Generate & Save Ed25519 Keypair (tweetnacl)
  else Invalid Code or Expired
    Server-->>Client: 400 Bad Request (Error: Invalid/Expired Code)
  end

  %% TRANSACTION SIGNING FLOW
  Note over User, DB: 3. Biometric Non-Repudiation Transaction Signing
  User->>Client: Proposes Financial Transaction (₹ Amount, Payee)
  Client->>User: Prompts OS Biometric Dialog (FaceID / Fingerprint)
  User-->>Client: Biometric Verification Success
  Client->>SecureStore: Retrieve Ed25519 Secret Key

  Client->>Server: POST /api/transactions (Data + Ed25519 Signature)
  Server->>DB: Save Transaction with Signature & Compute Merkle Block
  Server-->>Client: 201 Created (Transaction Logged & Chained)

## 🏢 6. Workspaces, Multi-Tenancy & RBAC Governance

### 6.1 Multi-Tenancy Model
HisabHero enforces tenant isolation at the database query layer via mandatory workspace authorization middleware (`requireWorkspaceAccess`). Every persistent financial document, transaction, bill, invoice, and inventory record belongs to a specific `workspaceId`.

1. **Personal Workspaces (`type: 'personal'`):**
   - Single-user private environment automatically generated for every registered account.
   - Tailored for personal net worth, discretionary spending, personal budgets, and goal trackers.
   - Join codes and role invitations are disabled.
2. **Business Workspaces (`type: 'business'`):**
   - Multi-user collaborative organization.
   - Features a 12-character cryptographic Join Code (format: `XXXX-XXXX-XXXX`) generated via unguessable character sets (`ABCDEFGHJKLMNPQRSTUVWXYZ23456789`).
   - Supports team invitations, approval policies (`single`, `majority`, `all`), and role matrices.
   - Convertible to a Personal Workspace upon owner confirmation.

## 🧮 8. Calculation Engine & Mathematical Models

HisabHero executes critical financial calculations through a centralized, floating-point safe mathematical calculation layer.

### 8.1 Safe Monetary Precision & Net Margin
To prevent binary floating-point representation drift (e.g. $0.1 + 0.2 = 0.30000000000000004$), all monetary figures undergo epsilon-offset safe rounding:

$$\text{SafeRound}(v) = \frac{\text{Round}\left((v + \epsilon) \times 100\right)}{100}, \quad \text{where } \epsilon = 2.220446049250313 \times 10^{-16}$$

The aggregate Net Financial Margin and Margin Percentage are computed strictly across approved ledger transactions:

$$\text{Net Margin} = \sum_{t \in \mathcal{T}_{\text{income}}} \text{Amount}(t) - \sum_{t \in \mathcal{T}_{\text{expense}}} \text{Amount}(t)$$

$$\text{Margin \%} = \begin{cases} 
\text{SafeRound}\left(\frac{\text{Net Margin}}{\sum \text{Amount}(t_{\text{income}})} \times 100\right), & \text{if } \sum \text{Amount}(t_{\text{income}}) > 0 \\
0, & \text{otherwise}
\end{cases}$$

---

### 8.2 GST Tax Extraction & Input Tax Credit (ITC) Equations
For gross-inclusive invoice amounts at tax rate $r\%$ (standard Indian rates: $5\%, 12\%, 18\%, 28\%$):

$$\text{Taxable Value} = \text{Round}\left(\frac{\text{Gross Total}}{1 + \frac{r}{100}}\right)$$

$$\text{Total GST} = \text{Gross Total} - \text{Taxable Value}$$

$$\text{CGST} = \text{Round}\left(\frac{\text{Total GST}}{2}\right), \quad \text{SGST} = \text{Total GST} - \text{CGST}$$

$$\text{Net Tax Payable} = \max\left(0, \text{Outbound Output Tax} - \text{Inbound ITC Claimable}\right)$$

---

### 8.3 Monte Carlo Stochastic Insolvency Simulation Engine
The forecasting engine executes $N = 1,000$ future cash flow simulations across time horizons $H \in \{30, 60, 90\}$ days using the Box-Muller Gaussian transform:

$$Z = \sqrt{-2 \ln(U_1)} \cos(2\pi U_2), \quad U_1, U_2 \sim \text{Uniform}(0, 1)$$

Given historical daily mean income $\mu_{\text{inc}}$, daily mean expense $\mu_{\text{exp}}$, expense volatility $\sigma_{\text{exp}} = 0.35 \mu_{\text{exp}}$, and collection volatility $\sigma_{\text{inc}} = 0.40 \mu_{\text{inc}}$:

$$\text{Daily Income}_d = \max\left(0, \mu_{\text{inc}} + Z \cdot \sigma_{\text{inc}}\right)$$

$$\text{Daily Expense}_d = \max\left(0, \mu_{\text{exp}} + Z \cdot \sigma_{\text{exp}}\right)$$

$$\text{Balance}_d^{(i)} = \text{Balance}_{d-1}^{(i)} + \text{Daily Income}_d - \text{Daily Expense}_d$$

$$\text{Insolvency Risk \%} = \left(\frac{\sum_{i=1}^{N} \mathbb{I}\left(\min_{d \in [1, H]} \text{Balance}_d^{(i)} < 0\right)}{N}\right) \times 100$$

$$\text{Risk Classification} = \begin{cases} 
\text{CRITICAL}, & \text{if Insolvency Risk } > 60\% \text{ or } \text{P}_{10}(\text{Min Balance}) < 0 \\
\text{HIGH}, & \text{if } 35\% < \text{Insolvency Risk } \le 60\% \\
\text{MODERATE}, & \text{if } 15\% < \text{Insolvency Risk } \le 35\% \\
\text{LOW}, & \text{if Insolvency Risk } \le 15\%
\end{cases}$$

---

### 8.4 Financial Health Score Algorithm ($0 - 100$)
$$S = \begin{cases} 
85, & \text{if } |\mathcal{T}| = 0 \text{ (Cold Start)} \\
\min\left(98, 70 + \text{Round}\left(\frac{\text{Income} - \text{Expense}}{\text{Income}} \times 30\right)\right), & \text{if } \text{Income} \ge \text{Expense} \\
\max\left(35, 70 - \text{Round}\left(\frac{\text{Expense} - \text{Income}}{\text{Expense}} \times 35\right)\right), & \text{if } \text{Expense} > \text{Income}
\end{cases}$$

---

### 8.5 Cryptographic Merkle Block Hash Equation
Each audit log block $k$ links to previous hash $H_{k-1}$ ($H_0 = 0^{64}$):

$$H_k = \text{SHA-256}\left(\text{JSON}\left(H_{k-1}, k, T_k, \text{userId}_k, \text{action}_k, \text{entityType}_k, \text{entityId}_k, \text{amount}_k, \text{meta}_k\right)\right)$$

## 🛡️ 13. Audit Logging, Safety & Compliance

HisabHero enforces institutional-grade immutability and continuous fraud monitoring.

### 13.1 Merkle Cryptographic Blockchain Audit Ledger
Every high-impact state mutation (workspace creation, role modification, join request approval, transaction deletion, invoice authorization) is recorded as a cryptographically chained block via `merkleEngine.js`:

```
[GENESIS_BLOCK: 0000000000000000...] 
       └── Link: SHA-256(Block 0 + Seq 1 + Payload 1) = BlockHash_1
              └── Link: SHA-256(BlockHash_1 + Seq 2 + Payload 2) = BlockHash_2
                     └── Link: SHA-256(BlockHash_2 + Seq 3 + Payload 3) = BlockHash_3
```

The `verifyMerkleChainIntegrity(workspaceId)` algorithm traverses all sequential entries, re-calculating payload hashes. Any manual database tampering breaks the cryptographic hash linkage and immediately raises a system alert.

### 13.2 Edge Fraud Anomaly Detection Guardrails
The `predictiveEngine.ts` evaluates transaction proposals against 3 heuristic fraud vectors:
1. **Vendor Bank Mutation Attack:** Detects when a disbursement targets an existing vendor name with an altered bank account number ($+50$ Anomaly Score).
2. **Perceptual Duplicate Detection:** Flags identical amounts submitted on the same date with matching or near-matching merchant descriptions ($+35$ Anomaly Score).
3. **Phantom Expense / Payroll Outlier Spikes:** Identifies transactions exceeding $3.2\times$ the rolling category average ($+30$ Anomaly Score).

Transactions scoring $\ge 50$ automatically lock and require Owner Biometric Re-Authentication before funds disbursement.
